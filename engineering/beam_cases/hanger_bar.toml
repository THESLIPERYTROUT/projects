# Beam stress sim case file
# Run with:  python beam_stress_sim.py beam_cases/gear_shaft.toml
# Units: SI (m, N, N·m, Pa). Positions are measured from the left end of the beam.

[units]
system = "SI"                # Imperial: in, lbf, lbf*in, psi, lbm/in^3, hp

[beam]
length = 0.8
mesh_density_factor = 0.0025   # spacing between simulated points (m)

[material]
young_modulus = 200e9
poisson_ratio = 0.3
density = 7850
yield_strength = 200e6

[design]
target_factor_of_safety = 2    

# Supports. type = "bearing" (reacts Fy, Fz) or "fixed" (reacts Fx, Fy, Fz, Mx).
[[supports]]
position = 0.0
type = "fixed"


# Geometry segments. Must be contiguous, start at 0 and end at beam length.
# TODO: non-circular sections not supported yet.
[[geometry]]
start = 0.00
end = 0.8
diameter = 1

# Loads. Supported types:
#   "driving gear" - position, diameter, power (W), speed (RPM), tooth_angle (deg)
#   "driven gear"  - position, diameter, tooth_angle (deg); takes power/speed from the driving gear
#   "point load"   - position, force = [Fx, Fy, Fz]
#   "point moment" - position, moment = [Mx, My, Mz]

[[loads]]
type = "point load"
position = 0.8               # m
force = [314.15, 157.07, -94.247]             # N

[[loads]]
type = "point moment"
position = 0.8               # m
moment = [94.247, 0, 0]          # N·m

[[loads]]
type = "point moment"
position = 0.0              # m
moment = [0, 314.15, 0]          # N·m


